# LoanWise AI — Render deploy (free web service).
# Repo: xebeczz/loanwise-ai (create it in the browser first — see DEPLOY_RENDER.md)
services:
  - type: web
    name: loanwise-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
