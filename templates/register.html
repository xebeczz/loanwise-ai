{% extends "base.html" %}
{% block title %}Create Account - LoanWise AI{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center p-6 bg-pagebg">
  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-teal2 flex items-center justify-center font-display font-extrabold text-white text-xl">L</div>
      <div><h1 class="font-display font-bold text-2xl text-navy">LoanWise AI</h1><p class="text-xs text-muted">Create your account</p></div>
    </div>
    <form method="post" class="space-y-4">
      <div><label class="block text-sm font-semibold mb-1.5" for="name">Full name</label>
        <input id="name" name="name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-royal" placeholder="Your name"/></div>
      <div><label class="block text-sm font-semibold mb-1.5" for="email">Email address</label>
        <input id="email" name="email" type="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-royal" placeholder="you@example.com"/></div>
      <div><label class="block text-sm font-semibold mb-1.5" for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-royal" placeholder="At least 6 characters"/></div>
      <div><label class="block text-sm font-semibold mb-1.5" for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-royal" placeholder="Repeat your password"/></div>
      <button type="submit" class="w-full py-3 rounded-xl bg-navy text-white font-semibold hover:bg-[#0b1c32]">Create Account</button>
    </form>
    <p class="text-center text-sm text-muted mt-5">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-royal font-semibold hover:underline">Sign in</a></p>
  </div>
</div>
{% endblock %}
